$kind: http-request
url: "{{baseUrl_practice}}/brands"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status es 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Responde con listado de marcas\", () => {\r

      \  const body = pm.response.json();\r

      \  const list = Array.isArray(body) ? body : body.data;\r

      \  pm.expect(list).to.be.an(\"array\").that.is.not.empty;\r

      });"
    language: text/javascript
order: 3000
