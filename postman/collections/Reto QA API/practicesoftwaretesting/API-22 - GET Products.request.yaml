$kind: http-request
url: "{{baseUrl_practice}}/products"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status es 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Lista paginada con arreglo data\", () => {\r

      \  const body = pm.response.json();\r

      \  pm.expect(body).to.have.property(\"data\");\r

      \  pm.expect(body.data).to.be.an(\"array\").that.is.not.empty;\r

      });"
    language: text/javascript
order: 2000
