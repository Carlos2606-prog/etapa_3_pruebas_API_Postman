$kind: http-request
url: "{{baseUrl_practice}}/products/999999999"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status es 404\", () => {\r

      \  pm.response.to.have.status(404);\r

      });\r

      pm.test(\"Responde en menos de 1 s\", () => {\r

      \  pm.expect(pm.response.responseTime).to.be.below(1000);\r

      });"
